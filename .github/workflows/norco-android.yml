# Norco Remote: build the Android arm64 release APK and sign it.
#
# This is upstream's `build-rustdesk-android` job from flutter-build.yml, cut down to one
# target (aarch64). When moving to a new upstream release, compare that job with this file and
# copy over any changed tool versions or steps. See NORCO.md.
#
# Signing uses four repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_SIGNING_KEY          base64 of the keystore file (one line)
#   ANDROID_ALIAS                key alias inside the keystore
#   ANDROID_KEY_STORE_PASSWORD   keystore password
#   ANDROID_KEY_PASSWORD         key password
# Without them the run still succeeds but produces a DEBUG-signed APK, which is only good for
# checking that the build works. Never upload a debug-signed APK to Managed Google Play.
name: Norco Remote Android

on:
  workflow_dispatch:
  push:
    tags:
      - "norco-v*"

permissions:
  contents: read

concurrency:
  group: norco-android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these equal to the values in flutter-build.yml of the upstream tag this branch sits on.
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  # Norco
  APP_ID: "com.norco.remote"
  RUST_TARGET: "aarch64-linux-android"
  ANDROID_ABI: "arm64-v8a"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-norco-remote-android:
    needs: [generate-bridge]
    name: build Norco Remote apk (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Read version
        shell: bash
        run: |
          VERSION=$(grep -E '^version:' flutter/pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=norco-remote-$VERSION-b${{ github.run_number }}-arm64" >> "$GITHUB_ENV"

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${ANDROID_ABI}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: norco-remote-lib-cache-android
          key: ${{ env.RUST_TARGET }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${RUST_TARGET}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}
          cp ./target/${RUST_TARGET}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}/librustdesk.so

      - name: Build apk
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # Increase Gradle JVM memory for CI builds
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          # Gradle signs with the debug key; the real signature is applied in "Sign apk" below,
          # so the keystore passwords never touch a file.
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/${ANDROID_ABI}/
          pushd flutter
          # versionCode has to go up with every upload to Managed Google Play, so it follows
          # the run number of this workflow (Flutter adds 2000 for arm64 with --split-per-abi).
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --build-number=${{ github.run_number }}
          popd
          mkdir -p out
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/unsigned.apk

      - name: Sign apk
        shell: bash
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          if [ -z "$ANDROID_SIGNING_KEY" ]; then
            echo "::warning title=DEBUG-signed APK::The ANDROID_SIGNING_KEY secret is not set. This APK is signed with a throw-away debug key. Use it for a build check only; do not upload it to Managed Google Play."
            mv out/unsigned.apk "out/${APK_NAME}-DEBUG-SIGNED.apk"
            echo "SIGNED_WITH=debug key (NOT for distribution)" >> "$GITHUB_ENV"
            exit 0
          fi
          for name in ANDROID_ALIAS ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (ANDROID_SIGNING_KEY is)."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/norco-release.keystore"
          # Tolerate line breaks in the pasted base64.
          printf '%s' "$ANDROID_SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -f -p 4 out/unsigned.apk out/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ANDROID_ALIAS" \
            --ks-pass env:ANDROID_KEY_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "out/${APK_NAME}.apk" \
            out/aligned.apk
          rm -f "$KEYSTORE" out/unsigned.apk out/aligned.apk out/*.idsig
          echo "SIGNED_WITH=Norco release key" >> "$GITHUB_ENV"

      - name: Verify apk
        shell: bash
        run: |
          APK=$(ls out/*.apk)
          BADGING=$("$BUILD_TOOLS/aapt2" dump badging "$APK")
          PACKAGE_LINE=$(grep -m1 '^package:' <<< "$BADGING")
          LABEL=$(grep -m1 '^application-label:' <<< "$BADGING" | cut -d"'" -f2)
          echo "$PACKAGE_LINE"
          grep -q "name='${APP_ID}'" <<< "$PACKAGE_LINE" || { echo "::error::Application ID is not ${APP_ID}"; exit 1; }
          [ "$LABEL" = "Norco Remote" ] || { echo "::error::App label is '$LABEL', expected 'Norco Remote'"; exit 1; }
          # The server settings must be compiled into the native library.
          unzip -p "$APK" "lib/${ANDROID_ABI}/librustdesk.so" > "$RUNNER_TEMP/librustdesk.so"
          grep -c -a -F "itinventory.norco-inc.com" "$RUNNER_TEMP/librustdesk.so" >/dev/null || { echo "::error::Server host not found in librustdesk.so"; exit 1; }
          grep -c -a -F "Fn4XaHrSvJgqkDV8rov+RsYegwN8XsRa+zszuHr1MVE=" "$RUNNER_TEMP/librustdesk.so" >/dev/null || { echo "::error::Server public key not found in librustdesk.so"; exit 1; }
          CERTS=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          echo "$CERTS"
          {
            echo "## $(basename "$APK")"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Signed with | **${SIGNED_WITH}** |"
            echo "| Application ID | \`$(echo "$PACKAGE_LINE" | sed -E "s/.* name='([^']+)'.*/\1/")\` |"
            echo "| Label | $LABEL |"
            echo "| versionName | $(echo "$PACKAGE_LINE" | sed -E "s/.*versionName='([^']+)'.*/\1/") |"
            echo "| versionCode | $(echo "$PACKAGE_LINE" | sed -E "s/.*versionCode='([^']+)'.*/\1/") |"
            echo "| Certificate SHA-256 | \`$(grep -m1 'SHA-256' <<< "$CERTS" | sed -E 's/.*: //')\` |"
            echo "| File SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_NAME }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90
